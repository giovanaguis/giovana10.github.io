<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Projeto de HTML CSS JavaScript"><title>Cadastro | MeuSite</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head>
